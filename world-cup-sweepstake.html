<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hobson Family World Cup 26</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0c07; --card:#1b1610; --card2:#241d13;
    --gold:#d9a93f; --gold-bright:#f0c66a; --line:rgba(217,169,63,.22);
    --text:#f5efe2; --muted:#a3967b;
    --amelia:#f2913d; --jonathan:#52c46d; --joanne:#5b8fe0; --evie:#e05252;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Barlow',system-ui,sans-serif; padding-bottom:60px;}
  header{padding:18px 16px 10px; text-align:center; border-bottom:1px solid var(--line);
    background:radial-gradient(ellipse at top, #251c0e 0%, var(--bg) 70%);}
  h1{font-family:'Barlow Condensed'; font-weight:700; font-size:30px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-bright); line-height:1.05;}
  h1 small{display:block; font-size:13px; letter-spacing:.35em; color:var(--muted); font-weight:600; margin-top:2px;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; margin-top:10px; font-size:13px; color:var(--muted);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
  nav{display:flex; gap:6px; overflow-x:auto; padding:12px 14px; position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch;}
  nav button{font-family:'Barlow Condensed'; font-weight:600; font-size:16px; letter-spacing:.05em; flex:none;
    background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer;}
  nav button.on{background:var(--gold); color:#171204; border-color:var(--gold);}
  main{max-width:560px; margin:0 auto; padding:14px;}
  .groupTitle{font-family:'Barlow Condensed'; font-weight:700; font-size:22px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-bright); margin:6px 2px 10px;}
  .match{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;}
  .match .when{grid-column:1/-1; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center; margin-bottom:2px;}
  .team{display:flex; align-items:center; gap:7px; font-weight:600; font-size:16px; min-width:0;}
  .team.away{justify-content:flex-end;}
  .team .flag{font-size:20px;}
  .scores{display:flex; align-items:center; gap:5px;}
  input.sc{width:42px; height:42px; text-align:center; font-size:19px; font-weight:600; color:var(--text);
    background:var(--card2); border:1px solid var(--line); border-radius:9px; font-family:'Barlow';}
  input.sc:focus{outline:2px solid var(--gold); border-color:var(--gold);}
  .dash{color:var(--muted);}
  table{width:100%; border-collapse:collapse; margin:14px 0 24px; font-size:14px;}
  th{font-family:'Barlow Condensed'; font-weight:600; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; font-size:12px; padding:6px 4px; text-align:center; border-bottom:1px solid var(--line);}
  th:first-child{text-align:left;}
  td{padding:7px 4px; text-align:center; border-bottom:1px solid rgba(255,255,255,.05);}
  td:first-child{text-align:left; font-weight:600;}
  tr.q td{color:var(--gold-bright);}
  .koRound{font-family:'Barlow Condensed'; font-weight:700; font-size:19px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-bright); margin:18px 2px 8px;}
  .ko .slot{font-size:11px; color:var(--muted); letter-spacing:.06em;}
  select.tm{background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 4px; font-size:15px; font-weight:600; width:100%; font-family:'Barlow';}
  .pens{grid-column:1/-1; display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); justify-content:center; margin-top:4px;}
  .pens select{width:auto; padding:5px 8px;}
  .bar{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border-top:1px solid var(--line); padding:9px 16px; font-size:13px; color:var(--muted); z-index:6;}
  .bar button{background:none; border:1px solid var(--line); color:var(--gold-bright); border-radius:999px; padding:6px 16px; font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.08em; cursor:pointer;}
  #status.ok{color:var(--gold-bright);}
  .note{font-size:12px; color:var(--muted); text-align:center; margin:4px 0 12px; line-height:1.5;}
  @media(prefers-reduced-motion:no-preference){ nav button, input.sc{transition:all .15s;} }
</style>
</head>
<body>
<header>
  <h1>Hobson World Cup 26<small>Family Sweepstake</small></h1>
  <div class="legend">
    <span><i class="dot" style="background:var(--amelia)"></i>Amelia</span>
    <span><i class="dot" style="background:var(--jonathan)"></i>Daddy</span>
    <span><i class="dot" style="background:var(--joanne)"></i>Joanne</span>
    <span><i class="dot" style="background:var(--evie)"></i>Evie</span>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="bar">
  <span id="status">Loading scores…</span>
  <button onclick="loadState(true)">Refresh</button>
</div>

<script>
const FLAGS={MEX:"🇲🇽",RSA:"🇿🇦",KOR:"🇰🇷",CZE:"🇨🇿",CAN:"🇨🇦",BIH:"🇧🇦",QAT:"🇶🇦",SUI:"🇨🇭",BRA:"🇧🇷",MAR:"🇲🇦",HAI:"🇭🇹",SCO:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",USA:"🇺🇸",PAR:"🇵🇾",AUS:"🇦🇺",TUR:"🇹🇷",GER:"🇩🇪",CUW:"🇨🇼",CIV:"🇨🇮",ECU:"🇪🇨",NED:"🇳🇱",JPN:"🇯🇵",SWE:"🇸🇪",TUN:"🇹🇳",BEL:"🇧🇪",EGY:"🇪🇬",IRN:"🇮🇷",NZL:"🇳🇿",ESP:"🇪🇸",CPV:"🇨🇻",KSA:"🇸🇦",URU:"🇺🇾",FRA:"🇫🇷",SEN:"🇸🇳",IRQ:"🇮🇶",NOR:"🇳🇴",ARG:"🇦🇷",ALG:"🇩🇿",AUT:"🇦🇹",JOR:"🇯🇴",POR:"🇵🇹",COD:"🇨🇩",UZB:"🇺🇿",COL:"🇨🇴",ENG:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",CRO:"🇭🇷",GHA:"🇬🇭",PAN:"🇵🇦"};
const OWNERS={
  amelia:["BRA","JPN","ENG","GER","URU","MEX","CIV","CAN","KOR","GHA","PAN","IRN"],
  jonathan:["ARG","CRO","TUR","ALG","EGY","IRQ","KSA","RSA","UZB","AUT","AUS","CUW"],
  joanne:["BIH","HAI","NED","JOR","NZL","CZE","FRA","SUI","SEN","COD","TUN","PAR"],
  evie:["NOR","ECU","MAR","CPV","POR","SWE","USA","BEL","COL","SCO","QAT","ESP"]
};
function ownerOf(t){for(const k in OWNERS){if(OWNERS[k].includes(t))return k;}return null;}

const GROUPS={
  A:[["11 Jun","MEX","RSA"],["12 Jun","KOR","CZE"],["18 Jun","CZE","RSA"],["19 Jun","MEX","KOR"],["25 Jun","RSA","KOR"],["25 Jun","CZE","MEX"]],
  B:[["12 Jun","CAN","BIH"],["13 Jun","QAT","SUI"],["18 Jun","SUI","BIH"],["18 Jun","CAN","QAT"],["24 Jun","SUI","CAN"],["24 Jun","BIH","QAT"]],
  C:[["13 Jun","BRA","MAR"],["14 Jun","HAI","SCO"],["19 Jun","SCO","MAR"],["20 Jun","BRA","HAI"],["24 Jun","MAR","HAI"],["24 Jun","SCO","BRA"]],
  D:[["13 Jun","USA","PAR"],["14 Jun","AUS","TUR"],["19 Jun","USA","AUS"],["20 Jun","TUR","PAR"],["25 Jun","TUR","USA"],["25 Jun","PAR","AUS"]],
  E:[["14 Jun","GER","CUW"],["15 Jun","CIV","ECU"],["20 Jun","GER","CIV"],["21 Jun","ECU","CUW"],["25 Jun","CUW","CIV"],["25 Jun","ECU","GER"]],
  F:[["14 Jun","NED","JPN"],["15 Jun","SWE","TUN"],["20 Jun","NED","SWE"],["21 Jun","TUN","JPN"],["26 Jun","TUN","NED"],["26 Jun","JPN","SWE"]],
  G:[["15 Jun","BEL","EGY"],["16 Jun","IRN","NZL"],["21 Jun","BEL","IRN"],["22 Jun","NZL","EGY"],["27 Jun","NZL","BEL"],["27 Jun","EGY","IRN"]],
  H:[["15 Jun","ESP","CPV"],["15 Jun","KSA","URU"],["21 Jun","ESP","KSA"],["21 Jun","URU","CPV"],["27 Jun","CPV","KSA"],["27 Jun","URU","ESP"]],
  I:[["16 Jun","FRA","SEN"],["16 Jun","IRQ","NOR"],["22 Jun","FRA","IRQ"],["23 Jun","NOR","SEN"],["26 Jun","NOR","FRA"],["26 Jun","SEN","IRQ"]],
  J:[["17 Jun","ARG","ALG"],["17 Jun","AUT","JOR"],["22 Jun","ARG","AUT"],["22 Jun","JOR","ALG"],["28 Jun","ALG","AUT"],["28 Jun","JOR","ARG"]],
  K:[["17 Jun","POR","COD"],["18 Jun","UZB","COL"],["23 Jun","POR","UZB"],["24 Jun","COL","COD"],["28 Jun","COL","POR"],["28 Jun","COD","UZB"]],
  L:[["17 Jun","ENG","CRO"],["18 Jun","GHA","PAN"],["23 Jun","ENG","GHA"],["24 Jun","PAN","CRO"],["27 Jun","PAN","ENG"],["27 Jun","CRO","GHA"]]
};
const KO=[
 ["Last 32",[ [73,"28 Jun","Grp A r-up v Grp B r-up"],[74,"29 Jun","Grp E winner v 3rd place"],[75,"30 Jun","Grp F winner v Grp C r-up"],[76,"29 Jun","Grp C winner v Grp F r-up"],[77,"30 Jun","Grp I winner v 3rd place"],[78,"30 Jun","Grp E r-up v Grp I r-up"],[79,"1 Jul","Grp A winner v 3rd place"],[80,"1 Jul","Grp L winner v 3rd place"],[81,"2 Jul","Grp D winner v 3rd place"],[82,"1 Jul","Grp G winner v 3rd place"],[83,"3 Jul","Grp K r-up v Grp L r-up"],[84,"2 Jul","Grp H winner v Grp J r-up"],[85,"3 Jul","Grp B winner v 3rd place"],[86,"3 Jul","Grp J winner v Grp H r-up"],[87,"4 Jul","Grp K winner v 3rd place"],[88,"3 Jul","Grp D r-up v Grp G r-up"] ]],
 ["Last 16",[ [89,"4 Jul","Winner M74 v Winner M77"],[90,"4 Jul","Winner M73 v Winner M75"],[91,"5 Jul","Winner M76 v Winner M78"],[92,"6 Jul","Winner M79 v Winner M80"],[93,"6 Jul","Winner M83 v Winner M84"],[94,"7 Jul","Winner M81 v Winner M82"],[95,"7 Jul","Winner M86 v Winner M88"],[96,"7 Jul","Winner M85 v Winner M87"] ]],
 ["Quarter-finals",[ [97,"9 Jul","Winner M89 v Winner M90"],[98,"10 Jul","Winner M93 v Winner M94"],[99,"11 Jul","Winner M91 v Winner M92"],[100,"12 Jul","Winner M95 v Winner M96"] ]],
 ["Semi-finals",[ [101,"14 Jul","Winner M97 v Winner M98"],[102,"15 Jul","Winner M99 v Winner M100"] ]],
 ["Third place",[ [103,"18 Jul","Losing semi-finalists"] ]],
 ["Final · New York",[ [104,"19 Jul","Winner M101 v Winner M102"] ]]
];

let state={g:{},k:{}};   // g: {"A0":[h,a]}  k: {"73":{h:"",a:"",hs:null,as:null,w:""}}
let view="A", saveTimer=null;

const $=s=>document.querySelector(s);
function dot(t){const o=ownerOf(t); return o?`<i class="dot" style="background:var(--${o})"></i>`:"";}
function teamHtml(t,away){return `<span class="team${away?' away':''}">${away?'':dot(t)}<span class="flag">${FLAGS[t]||""}</span>${t}${away?dot(t):''}</span>`;}

function buildNav(){
  const n=$("#nav");
  n.innerHTML=Object.keys(GROUPS).map(g=>`<button data-v="${g}">${g}</button>`).join("")+`<button data-v="KO">Knockouts</button>`;
  n.onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v; render();}};
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  view==="KO"?renderKO():renderGroup(view);
}

function renderGroup(g){
  const rows=GROUPS[g].map((m,i)=>{
    const s=state.g[g+i]||[null,null];
    return `<div class="match">
      <div class="when">${m[0]}</div>
      ${teamHtml(m[1])}
      <span class="scores"><input class="sc" type="number" min="0" inputmode="numeric" value="${s[0]??""}" onchange="setG('${g}',${i},0,this.value)"><span class="dash">–</span><input class="sc" type="number" min="0" inputmode="numeric" value="${s[1]??""}" onchange="setG('${g}',${i},1,this.value)"></span>
      ${teamHtml(m[2],true)}
    </div>`;
  }).join("");
  $("#main").innerHTML=`<div class="groupTitle">Group ${g}</div>${rows}${tableHtml(g)}`;
}

function tableHtml(g){
  const teams={};
  GROUPS[g].forEach(m=>{[m[1],m[2]].forEach(t=>teams[t]=teams[t]||{t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});});
  GROUPS[g].forEach((m,i)=>{
    const s=state.g[g+i]; if(!s||s[0]==null||s[1]==null)return;
    const H=teams[m[1]],A=teams[m[2]],h=+s[0],a=+s[1];
    H.p++;A.p++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
    if(h>a){H.w++;A.l++;H.pts+=3;}else if(h<a){A.w++;H.l++;A.pts+=3;}else{H.d++;A.d++;H.pts++;A.pts++;}
  });
  const list=Object.values(teams).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
  return `<table><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>`+
    list.map((r,i)=>`<tr class="${i<2?'q':''}"><td>${dot(r.t)} ${FLAGS[r.t]} ${r.t}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td>${r.pts}</td></tr>`).join("")+
    `</table><p class="note">Top two go through automatically; the eight best third-placed teams join them in the last 32.</p>`;
}

function renderKO(){
  const opts=t=>`<option value=""></option>`+Object.keys(FLAGS).sort().map(c=>`<option ${c===t?"selected":""}>${c}</option>`).join("");
  let html=`<div class="groupTitle">Knockout rounds</div><p class="note">Pick the teams as they come through, then add scores. If it finishes level, choose who won the shootout.</p>`;
  KO.forEach(([round,ms])=>{
    html+=`<div class="koRound">${round}</div>`;
    ms.forEach(([n,d,slot])=>{
      const k=state.k[n]||{h:"",a:"",hs:null,as:null,w:""};
      const draw=k.hs!=null&&k.as!=null&&k.hs!==""&&k.as!==""&&+k.hs===+k.as;
      html+=`<div class="match ko">
        <div class="when">Match ${n} · ${d} · <span class="slot">${slot}</span></div>
        <select class="tm" onchange="setK(${n},'h',this.value)">${opts(k.h)}</select>
        <span class="scores"><input class="sc" type="number" min="0" inputmode="numeric" value="${k.hs??""}" onchange="setK(${n},'hs',this.value)"><span class="dash">–</span><input class="sc" type="number" min="0" inputmode="numeric" value="${k.as??""}" onchange="setK(${n},'as',this.value)"></span>
        <select class="tm" onchange="setK(${n},'a',this.value)">${opts(k.a)}</select>
        ${draw?`<div class="pens">Won on penalties: <select onchange="setK(${n},'w',this.value)"><option value=""></option><option ${k.w===k.h?"selected":""}>${k.h}</option><option ${k.w===k.a?"selected":""}>${k.a}</option></select></div>`:""}
      </div>`;
    });
  });
  $("#main").innerHTML=html;
}

function setG(g,i,side,val){
  const key=g+i; state.g[key]=state.g[key]||[null,null];
  state.g[key][side]=val===""?null:Math.max(0,parseInt(val)||0);
  queueSave(); renderGroup(g);
}
function setK(n,f,val){
  state.k[n]=state.k[n]||{h:"",a:"",hs:null,as:null,w:""};
  state.k[n][f]=(f==="hs"||f==="as")?(val===""?null:Math.max(0,parseInt(val)||0)):val;
  queueSave(); renderKO();
}

function queueSave(){
  $("#status").textContent="Saving…"; $("#status").className="";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await window.storage.set("hobson-wc26", JSON.stringify(state), true);
      $("#status").textContent="Saved — everyone can see it"; $("#status").className="ok";
    }catch(e){ $("#status").textContent="Couldn't save — check connection"; }
  },600);
}

async function loadState(manual){
  try{
    const r=await window.storage.get("hobson-wc26", true);
    if(r&&r.value) state=JSON.parse(r.value);
    $("#status").textContent=manual?"Up to date":"Scores loaded"; $("#status").className="ok";
  }catch(e){ $("#status").textContent="No scores yet — add the first!"; }
  render();
}

buildNav();
loadState(false);
</script>
</body>
</html>
